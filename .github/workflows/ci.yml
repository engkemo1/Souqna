name: CI

on:
  push:
    branches: [main, prod-hardening]
  pull_request:
    branches: [main, prod-hardening]

jobs:
  verify:
    name: Lint, Test, Build & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & syntax check
        run: npm run lint

      - name: Format check (warnings)
        run: npm run format:check

      - name: Run unit & integration tests
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret-with-at-least-32-characters-long
          ADMIN_KEY: ci-test-admin-key-16chars
        run: npm test

      - name: Build web production bundle
        run: npm run build

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  docker-smoke:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        run: docker build --tag souqna:ci-smoke .
