name: CI

on:
  push:
    branches: [main, prod-hardening]
  pull_request:
    branches: [main, prod-hardening]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and formatting check
        run: |
          npm run lint
          npm run format:check

      - name: Run test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production container image
        run: docker build -t souqna-smoke:ci .
