<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f5f9"/><stop offset="1" stop-color="#e0e7ff"/></linearGradient>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#99f6e4"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fed7aa"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#334155"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#334155" flood-opacity=".18"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .ar{font-family:Tahoma,Arial,sans-serif;direction:rtl;unicode-bidi:plaintext}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="800" y="65" text-anchor="middle" class="ar" font-size="38" font-weight="900" fill="#0f172a">ستايلات مودرن لعروض Twsit</text>
  <text x="800" y="103" text-anchor="middle" class="ar" font-size="20" fill="#64748b">تصميمات ناعمة وفخمة تناسب الصفحة الرئيسية والموبايل</text>

  <!-- glassmorphism -->
  <g filter="url(#shadow)">
    <rect x="65" y="145" width="710" height="350" rx="38" fill="#ffffff" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".85" stroke-width="2"/>
    <circle cx="680" cy="180" r="180" fill="url(#lav)" opacity=".8" filter="url(#blur)"/>
    <circle cx="170" cy="465" r="145" fill="#a5b4fc" opacity=".45" filter="url(#blur)"/>
    <rect x="105" y="185" width="80" height="80" rx="24" fill="#111827" opacity=".9"/>
    <text x="145" y="238" text-anchor="middle" font-size="32" fill="white">★</text>
    <text x="710" y="245" text-anchor="end" class="ar" font-size="24" font-weight="700" fill="#4c1d95">عرض مميز</text>
    <text x="710" y="330" text-anchor="end" class="ar" font-size="66" font-weight="900" fill="#111827">خصم 50%</text>
    <text x="710" y="375" text-anchor="end" class="ar" font-size="25" fill="#475569">اختياراتك المفضلة بسعر أقل</text>
    <rect x="510" y="412" width="200" height="52" rx="26" fill="#111827"/>
    <text x="610" y="447" text-anchor="middle" class="ar" font-size="22" font-weight="800" fill="white">تسوق الآن</text>
  </g>

  <!-- organic / editorial -->
  <g filter="url(#shadow)">
    <rect x="825" y="145" width="710" height="350" rx="38" fill="#fff7ed"/>
    <path d="M1110 145h425v350h-425c80-72 110-165 0-350z" fill="url(#peach)"/>
    <path d="M1230 185c85 15 150 70 175 155-75 38-159 29-218-27 10-47 24-87 43-128z" fill="#fff" opacity=".32"/>
    <text x="910" y="225" class="ar" font-size="23" font-weight="700" fill="#9a3412">تشكيلة جديدة</text>
    <text x="910" y="310" class="ar" font-size="57" font-weight="900" fill="#431407">عرض اليوم</text>
    <text x="910" y="355" class="ar" font-size="24" fill="#7c2d12">خصومات لفترة محدودة</text>
    <rect x="910" y="412" width="200" height="52" rx="12" fill="#431407"/>
    <text x="1010" y="447" text-anchor="middle" class="ar" font-size="22" font-weight="800" fill="white">اكتشف العرض</text>
    <text x="1380" y="390" text-anchor="middle" font-size="82" font-weight="900" fill="#fff">%</text>
  </g>

  <!-- 3D bubble -->
  <g filter="url(#shadow)">
    <rect x="65" y="585" width="710" height="350" rx="38" fill="url(#mint)"/>
    <circle cx="620" cy="750" r="150" fill="#ecfeff" opacity=".5"/>
    <circle cx="620" cy="750" r="104" fill="#0f766e" opacity=".24"/>
    <ellipse cx="585" cy="700" rx="52" ry="22" fill="#fff" opacity=".7" transform="rotate(-30 585 700)"/>
    <text x="125" y="665" class="ar" font-size="23" font-weight="700" fill="#134e4a">عرض المحل</text>
    <text x="125" y="755" class="ar" font-size="56" font-weight="900" fill="#042f2e">شحن مجاني</text>
    <text x="125" y="800" class="ar" font-size="24" fill="#134e4a">اطلب دلوقتي واستلم بسهولة</text>
    <rect x="125" y="850" width="200" height="52" rx="26" fill="#042f2e"/>
    <text x="225" y="885" text-anchor="middle" class="ar" font-size="22" font-weight="800" fill="white">اطلب الآن</text>
  </g>

  <!-- premium dark -->
  <g filter="url(#shadow)">
    <rect x="825" y="585" width="710" height="350" rx="38" fill="url(#night)"/>
    <path d="M1185 935c30-140 110-259 260-350h90v350z" fill="#f43f5e" opacity=".85"/>
    <path d="M1275 935c20-105 72-196 170-260l90 80v180z" fill="#fb7185" opacity=".65"/>
    <text x="910" y="665" class="ar" font-size="23" font-weight="700" fill="#fda4af">لفترة محدودة</text>
    <text x="910" y="755" class="ar" font-size="57" font-weight="900" fill="white">اشترِ 2 وخد 1</text>
    <text x="910" y="800" class="ar" font-size="24" fill="#cbd5e1">الهدية علينا النهارده</text>
    <rect x="910" y="850" width="200" height="52" rx="12" fill="#fb7185"/>
    <text x="1010" y="885" text-anchor="middle" class="ar" font-size="22" font-weight="800" fill="#4c0519">شوف التفاصيل</text>
    <text x="1380" y="785" text-anchor="middle" font-size="100" font-weight="900" fill="white" opacity=".9">1+1</text>
  </g>
</svg>
