<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f97316"/><stop offset="1" stop-color="#facc15"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#be123c"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity=".18"/></filter>
    <style>
      .ar{font-family:Tahoma,Arial,sans-serif;direction:rtl;unicode-bidi:bidi-override}
      .small{font-size:24px;font-weight:600;letter-spacing:.5px}
      .title{font-size:58px;font-weight:900}
      .sub{font-size:28px;font-weight:500}
      .cta{font-size:25px;font-weight:800}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="800" y="72" text-anchor="middle" class="ar" font-size="38" font-weight="900" fill="#111827">أشكال إعلانات وعروض Twsit</text>
  <text x="800" y="112" text-anchor="middle" class="ar" font-size="20" fill="#64748b">معاينة أولية لاختيار الشكل المناسب من لوحة الأدمن</text>

  <g filter="url(#shadow)">
