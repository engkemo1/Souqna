    <circle cx="650" cy="230" r="140" fill="#a78bfa" opacity=".18"/><circle cx="720" cy="420" r="180" fill="#22d3ee" opacity=".10"/>
    <text x="700" y="220" text-anchor="end" class="ar small" fill="#ddd6fe">عرض مميز من Twsit</text>
