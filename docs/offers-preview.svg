    <text x="700" y="365" text-anchor="end" class="ar sub" fill="#ede9fe">على التشكيلة المختارة</text>
    <rect x="470" y="410" rx="18" width="230" height="54" fill="white"/>
    <text x="585" y="446" text-anchor="middle" class="ar cta" fill="#4c1d95">تسوق الآن</text>
    <text x="130" y="452" class="ar" font-size="22" fill="#c4b5fd">مميز ★</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="155" rx="34" width="700" height="350" fill="url(#g2)"/>
    <path d="M1230 180h230v230h-230z" fill="#ccfbf1" opacity=".14" transform="rotate(15 1345 295)"/>
    <text x="1460" y="220" text-anchor="end" class="ar small" fill="#ccfbf1">لفترة محدودة</text>
    <text x="1460" y="315" text-anchor="end" class="ar title" fill="white">شحن مجاني</text>
    <text x="1460" y="365" text-anchor="end" class="ar sub" fill="#ccfbf1">اطلب الآن واستلم بدون مصاريف</text>
    <rect x="1230" y="410" rx="18" width="230" height="54" fill="white"/>
    <text x="1345" y="446" text-anchor="middle" class="ar cta" fill="#115e59">اكتشف العرض</text>
    <text x="890" y="452" class="ar" font-size="22" fill="#99f6e4">الأكثر طلبًا</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="585" rx="34" width="700" height="350" fill="url(#g3)"/>
    <circle cx="170" cy="760" r="170" fill="#fff7ed" opacity=".18"/><circle cx="300" cy="900" r="90" fill="#fff" opacity=".12"/>
    <text x="700" y="650" text-anchor="end" class="ar small" fill="#7c2d12">عرض المحل</text>
    <text x="700" y="745" text-anchor="end" class="ar title" fill="#431407">اشترِ 2 وخد 1</text>
    <text x="700" y="795" text-anchor="end" class="ar sub" fill="#7c2d12">اختار منتجاتك واستفيد بالهدية</text>
    <rect x="470" y="840" rx="18" width="230" height="54" fill="#431407"/>
    <text x="585" y="876" text-anchor="middle" class="ar cta" fill="white">شوف التفاصيل</text>
    <text x="130" y="900" class="ar" font-size="22" fill="#7c2d12">هدية مجانية 🎁</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="585" rx="34" width="700" height="350" fill="url(#g4)"/>
    <circle cx="1370" cy="760" r="180" fill="#ffe4e6" opacity=".16"/><circle cx="1220" cy="650" r="90" fill="#fff" opacity=".10"/>
    <text x="1460" y="650" text-anchor="end" class="ar small" fill="#ffe4e6">لا تفوّت الفرصة</text>
    <text x="1460" y="745" text-anchor="end" class="ar title" fill="white">عرض اليوم</text>
    <text x="1460" y="795" text-anchor="end" class="ar sub" fill="#ffe4e6">خصومات قوية حتى نهاية اليوم</text>
    <rect x="1230" y="840" rx="18" width="230" height="54" fill="white"/>
    <text x="1345" y="876" text-anchor="middle" class="ar cta" fill="#9f1239">احجز العرض</text>
    <text x="890" y="900" class="ar" font-size="22" fill="#fecdd3">ينتهي قريبًا ⏱</text>
