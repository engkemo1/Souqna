<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="معاينة تصميم أقسام الموبايل">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#eaf0f8"/></linearGradient>
    <linearGradient id="women" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1c5c8"/><stop offset="1" stop-color="#8b536b"/></linearGradient>
    <linearGradient id="men" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b9d5df"/><stop offset="1" stop-color="#24466b"/></linearGradient>
    <linearGradient id="kids" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5d3a3"/><stop offset="1" stop-color="#7d9c7e"/></linearGradient>
    <linearGradient id="makeup" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0b2b9"/><stop offset="1" stop-color="#a94d69"/></linearGradient>
    <linearGradient id="perfume" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e4d4b0"/><stop offset="1" stop-color="#8e6541"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#03244d" flood-opacity=".16"/></filter>
  </defs>
  <rect width="390" height="844" fill="url(#bg)"/>
  <rect x="18" y="18" width="354" height="42" rx="21" fill="#fff"/>
  <circle cx="45" cy="39" r="13" fill="#03244d"/><text x="45" y="44" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">T</text>
  <text x="345" y="44" text-anchor="end" font-family="Arial" font-size="14" font-weight="700" fill="#03244d">تويست</text>
  <text x="350" y="92" text-anchor="end" font-family="Arial" font-size="23" font-weight="800" fill="#03244d">تسوّق حسب القسم</text>
  <text x="350" y="114" text-anchor="end" font-family="Arial" font-size="12" fill="#718096">اختار اللي يناسبك بسهولة</text>
