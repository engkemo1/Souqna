    <rect x="18" y="136" width="354" height="172" rx="26" fill="url(#women)"/>
  </g>
  <circle cx="195" cy="188" r="28" fill="#f7d9d8" opacity=".7"/><path d="M177 271c3-34 12-57 18-57s15 23 18 57" fill="#fff" opacity=".82"/><circle cx="195" cy="207" r="12" fill="#c78386"/>
  <rect x="34" y="237" width="322" height="54" rx="18" fill="#03244d" fill-opacity=".78"/>
  <text x="340" y="260" text-anchor="end" font-family="Arial" font-size="18" font-weight="800" fill="#fff">حريمي</text>
  <text x="340" y="278" text-anchor="end" font-family="Arial" font-size="10" fill="#e5edf8">١٢٤ منتج</text>
  <rect x="48" y="256" width="76" height="25" rx="12" fill="#fff"/><text x="86" y="273" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#03244d">تسوق الآن</text>
  <text x="350" y="332" text-anchor="end" font-family="Arial" font-size="13" font-weight="700" fill="#718096">الأقسام الأكثر طلبًا</text>
