    <rect x="18" y="348" width="156" height="128" rx="20" fill="url(#men)"/>
    <rect x="186" y="348" width="156" height="128" rx="20" fill="url(#kids)"/>
    <rect x="18" y="490" width="156" height="128" rx="20" fill="url(#makeup)"/>
    <rect x="186" y="490" width="156" height="128" rx="20" fill="url(#perfume)"/>
  </g>
  <g fill="#fff" font-family="Arial" font-weight="800" font-size="16">
