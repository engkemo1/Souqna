    <text x="158" y="591" text-anchor="end">مكياج</text><text x="326" y="591" text-anchor="end">عطور</text>
  </g>
  <g fill="#fff" font-family="Arial" font-size="10"><text x="158" y="465" text-anchor="end" opacity=".8">٥٨ منتج</text><text x="326" y="465" text-anchor="end" opacity=".8">٣٢ منتج</text><text x="158" y="607" text-anchor="end" opacity=".8">٤١ منتج</text><text x="326" y="607" text-anchor="end" opacity=".8">٢٧ منتج</text></g>
