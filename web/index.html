    <div id="boot" aria-hidden="true">
      <style>
        #boot{position:absolute;inset:0 0 auto 0;z-index:5;background:#fff;min-height:100vh}
        #boot i{display:block;border-radius:16px;background:linear-gradient(100deg,#eef2f8 30%,#f8fafd 50%,#eef2f8 70%);background-size:300% 100%;animation:bootsh 1.4s linear infinite}
        @keyframes bootsh{from{background-position:100% 0}to{background-position:0 0}}
        #boot .bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #e2e8f0}
        #boot .bar b{display:block;width:92px;height:28px;border-radius:8px;background:#03244D}
        #boot .wrap{padding:16px;max-width:1280px;margin:0 auto}
        #boot .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
        @media(min-width:768px){#boot .grid{grid-template-columns:repeat(4,1fr);gap:20px}}
        @media(prefers-reduced-motion:reduce){#boot i{animation:none}}
      </style>
