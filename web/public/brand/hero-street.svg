<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#f5f7f6"/><stop offset="1" stop-color="#e8e1d7"/></linearGradient>
    <linearGradient id="street" x2="0" y2="1"><stop stop-color="#d6d0c6"/><stop offset="1" stop-color="#eee9e1"/></linearGradient>
    <linearGradient id="leftBuilding" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9d2c7"/><stop offset="1" stop-color="#9b9389"/></linearGradient>
    <linearGradient id="rightBuilding" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#d8d1c8"/><stop offset="1" stop-color="#aaa195"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#c7d7d8"/><stop offset="1" stop-color="#7e9a9d"/></linearGradient>
    <linearGradient id="warmGlass" x2="0" y2="1"><stop stop-color="#fff2dc"/><stop offset="1" stop-color="#d7b894"/></linearGradient>
