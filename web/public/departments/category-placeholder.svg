    <path d="M490 390h175l-17 230H505z" fill="url(#orangeBag)" stroke="#C94708" stroke-width="6"/>
    <path d="M525 395c0-92 76-92 76 0" fill="none" stroke="#03244D" stroke-width="13" stroke-linecap="round"/>
